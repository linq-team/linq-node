name: Publish MCP Registry
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact released MCP package version
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: mcp-registry-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate manifest and published ownership
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --test examples/mcp-directory/test/*.test.mjs
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const manifest=JSON.parse(readFileSync('examples/mcp-directory/server.json','utf8'));
          assert.equal(manifest.version,process.env.RELEASE_VERSION);
          assert.equal(manifest.name,'io.github.linq-team/linq');
          const published=JSON.parse(execFileSync('npm',['view',`@linqapp/sdk-mcp@${manifest.version}`,'--json'],{encoding:'utf8'}));
          assert.equal(published.version,manifest.version);
          assert.equal(published.mcpName,manifest.name);
          JS
          node examples/mcp-directory/smoke.mjs
      - name: Install pinned MCP publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish through GitHub OIDC
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish examples/mcp-directory/server.json
