name: Auto-merge release PR

# DO NOT EDIT IN THE SDK REPO. This file is installed into linq-go, linq-node,
# and linq-python by linq-sdks' build-sdks.yml and is overwritten on every
# regeneration. Edit .github/sdk-workflows/auto-merge-release.yml in
# linq-team/linq-sdks instead.
#
# Merges the `stainless/release` -> `main` PR once CI is green, so a synapse
# spec change reaches npm / PyPI / git tags without a manual merge. Scoped to
# that one branch: human, Dependabot, and Devin PRs still require review.
#
# workflow_run (rather than pull_request) for three reasons: it always executes
# the copy of this file on the default branch, so a modified copy pushed to the
# release branch cannot hijack it; it is unreachable from fork PRs, so the token
# is never exposed to untrusted code; and it re-fires after a re-run, so a
# cleared flake merges with no new push.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    # workflow_run fires for every branch and every CI trigger. Only the push
    # run matters: ci.yml gates its jobs on
    # `github.event_name == 'push' || ...head.repo.fork`, so the pull_request
    # run of a non-fork PR skips every job and concludes `skipped`. Without the
    # event guard that skip would be read as a failure and trigger a pointless
    # re-run.
    if: >-
      github.event.workflow_run.head_branch == 'stainless/release' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Merge, retry, or stand down
        env:
          # The `main` ruleset requires an approving review, which no bot can
          # give itself, and GITHUB_TOKEN cannot bypass a ruleset — so the merge
          # needs --admin and a PAT. Same org secret release-please.yml uses.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # No checkout in this job, so gh has no git context to infer from.
          GH_REPO: ${{ github.repository }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          if [ "$CONCLUSION" = failure ]; then
            # Transient infra failures are routine here — the mcp-server bundle
            # pulls jq-web from a GitHub release during `npm install` and 503s
            # under load. Exactly one retry: the re-run re-fires this workflow
            # with run_attempt=2, so a second failure falls through and stops.
            if [ "$ATTEMPT" -lt 2 ]; then
              echo "CI failed on attempt ${ATTEMPT} — re-running failed jobs."
              gh run rerun "$RUN_ID" --failed
            else
              echo "::warning::CI failed on attempt ${ATTEMPT} — release PR left open."
              echo "CI failed after ${ATTEMPT} attempts. Release PR not merged." \
                >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          # cancelled, skipped, timed_out, action_required — not a green build
          # and not a flake to retry. Leave it alone.
          if [ "$CONCLUSION" != success ]; then
            echo "CI concluded '${CONCLUSION}' — no action."
            exit 0
          fi

          N=$(gh pr list --head stainless/release --base main --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$N" ]; then
            echo "No open release PR — nothing to merge."
            exit 0
          fi

          # Squash is the only method the repos enable; --admin covers the
          # required review. Both are why this can't use `gh pr merge --auto`.
          echo "CI green — merging release PR #${N}."
          gh pr merge "$N" --squash --admin
          echo "Auto-merged release PR #${N}." >> "$GITHUB_STEP_SUMMARY"
